<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Form - WebCraft</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">
        <h2 class="mb-4">Add Entry</h2>

        <form onsubmit="return validateForm()">

            <div class="mb-3">
                <label for="name" class="form-label">Name</label>
                <input type="text" id="name" class="form-control"
                       placeholder="Enter Name">
            </div>

            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="text" id="email" class="form-control"
                       placeholder="Enter Email">
            </div>

            <div class="mb-3">
                <label for="phone" class="form-label">Phone</label>
                <input type="text" id="phone" class="form-control"
                       placeholder="Enter Phone">
            </div>

            <button type="submit" class="btn btn-success">Submit</button>
            <button type="reset" class="btn btn-secondary">Clear Form</button>

        </form>
    </div>

    <script>
        function validateForm() {
            let name = document.getElementById("name").value.trim();
            let email = document.getElementById("email").value.trim();
            let phone = document.getElementById("phone").value.trim();

 if (name=="" || email=="" || phone=="") { alert("All fields required!"); return false; }
 if (!email.includes("@")) { alert("Invalid email!"); return false; }
 if (phone.length !== 10 || isNaN(phone)) { alert("Phone must be 10 digits!"); return false; }
 return true;
}

    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebCraft - Contact</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="index.html">WebCraft</a>

        <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="form.html">Form</a></li>
            <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
            <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
        </ul>
    </div>
</nav>

<div class="container mt-5">
    <h1>Contact Us</h1>
    <p class="text-muted">Please fill in the form below.</p>

    <form>
        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" id="name" class="form-control"
                   placeholder="Enter your name">
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" class="form-control"
                   placeholder="Enter your email">
        </div>

        <div class="mb-3">
            <label for="message" class="form-label">Message</label>
            <textarea id="message" class="form-control" rows="4"
                      placeholder="Enter your message"></textarea>
        </div>

        <button type="button" class="btn btn-primary"
                onclick="alert('Contact form demo completed!')">
            Submit
        </button>
    </form>
</div>

<footer class="text-center mt-5 p-3 bg-light">
    Developed by Zainab | 2026
</footer>

</body>
</html>
